name: PHP Lint

on:
  push:
    paths:
      - '**.php'
      - '.github/workflows/php-lint.yml'
  pull_request:
    paths:
      - '**.php'
      - '.github/workflows/php-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    # Official PHP image instead of the ondrej/php PPA, which has no release
    # for newer ubuntu-latest images (e.g. 26.04 "resolute").
    container: php:8.2-cli@sha256:604de2f0cba9e9dde16cf717c2f03b0948c99949bdf7c11cdf76326e0da7d2ea
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show PHP version
        run: php -v

      - name: Run php -l on all PHP files
        run: |
          ERRORS=0
          CHECKED=0

          while IFS= read -r -d '' file; do
            CHECKED=$((CHECKED + 1))
            if ! php -l "$file" > /dev/null 2>&1; then
              php -l "$file"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find . \
            -name "*.php" \
            -not -path "./vendor/*" \
            -not -path "./.git/*" \
            -print0)

          echo "Checked ${CHECKED} file(s). Found ${ERRORS} syntax error(s)."

          if [ "$ERRORS" -gt 0 ]; then
            exit 1
          fi
