name: PHPUnit

# Runs the HTTP-level regression suite (tests/Feature) against the real
# production image (resources/docker/Containerfile, php:8.4.27-apache) backed by
# MariaDB 11, using the compose stack in compose.yml + compose.test.yml. The
# PHPUnit runner image is built from the same PHP release.

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:
    inputs:
      fail_fast:
        description: 'Stop on first failure'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

concurrency:
  group: phpunit-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE: docker compose -f compose.yml -f compose.test.yml

jobs:
  test:
    name: PHPUnit (PHP 8.4.27, MariaDB 11)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start app + database
        run: $COMPOSE up -d --build --wait app

      - name: Show PHP version of the app under test
        run: |
          $COMPOSE exec -T app php -v
          $COMPOSE exec -T app php -r 'exit(version_compare(PHP_VERSION, "8.4.27", ">=") ? 0 : 1);'

      - name: Run PHPUnit
        run: |
          $COMPOSE build phpunit
          $COMPOSE run --rm phpunit sh -c \
            'php -v && composer install --no-interaction --no-progress && vendor/bin/phpunit ${{ github.event.inputs.fail_fast == 'true' && '--stop-on-failure' || '' }}'

      - name: Show app logs on failure
        if: failure()
        run: $COMPOSE logs app

      - name: Tear down
        if: always()
        run: $COMPOSE down -v
