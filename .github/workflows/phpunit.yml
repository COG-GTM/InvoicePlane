name: PHPUnit

# HTTP-level regression suite (tests/Regression). Boots the self-contained
# compose.yml stack (php-apache + MariaDB), installs and seeds a known admin via
# tests/compose.regression.yml, then drives login, clients, products, quotes,
# invoices + PDF, payments and settings over HTTP with PHPUnit.

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:
    inputs:
      fail_fast:
        description: 'Stop on first failure'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

env:
  COMPOSE: docker compose -f compose.yml -f tests/compose.regression.yml

jobs:
  regression:
    name: HTTP regression suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start the app
        run: $COMPOSE up -d --build

      - name: Report the runtime PHP version
        run: $COMPOSE exec -T app php -v

      - name: Install dev dependencies for the test runner
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD":/app -w /app composer:2 \
            composer install --no-interaction --no-progress --ignore-platform-req=ext-gd --ignore-platform-req=ext-bcmath

      - name: Wait for the app to finish installing
        run: |
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null "http://localhost:4895/sessions/login"; then
              echo "App ready after ${i}x5s"
              exit 0
            fi
            sleep 5
          done
          $COMPOSE logs app
          exit 1

      - name: Run PHPUnit
        run: |
          docker run --rm --network host -v "$PWD":/app -w /app php:8.4.27-cli \
            vendor/bin/phpunit --testdox ${{ github.event.inputs.fail_fast == 'true' && '--stop-on-failure' || '' }}

      - name: Show logs on failure
        if: failure()
        run: $COMPOSE logs

      - name: Tear down
        if: always()
        run: $COMPOSE down -v
